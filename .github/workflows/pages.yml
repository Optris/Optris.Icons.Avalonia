name: Deploy to GitHub Pages

env:
  PROJECT_PATH: src/Demo.Browser/Demo.Browser.csproj

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # global.json lets a newer SDK roll forward, and the runner image ships newer SDKs than the
      # one installed above. This job publishes a net10.0-browser app with the .NET 10 wasm-tools
      # workload, so it pins the SDK to the 10.0 band for itself.
      - name: Use the .NET 10 SDK in this job
        run: |
          sed -i 's/"rollForward": "latestMajor"/"rollForward": "latestFeature"/' global.json
          dotnet --version | grep -E '^10\.0\.'

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # Without the wasm-tools workload of the selected SDK the publish still succeeds, but the
      # native SkiaSharp library is not linked and the demo fails at startup. Fail instead.
      - name: Publish .NET Project
        run: |
          set -o pipefail
          dotnet publish $PROJECT_PATH -c Release -o release --nologo | tee publish.log
          if grep -q "Publishing without optimizations" publish.log; then
            echo "::error::The browser demo was published without the wasm-tools workload of the selected SDK."
            exit 1
          fi

      - name: Clean up _framework for static hosting
        run: |
          cd release/wwwroot/_framework
          # Remove pre-compressed files (GitHub Pages handles compression)
          rm -f *.br *.gz
          # Strip fingerprint hashes: Name.HASH.ext -> Name.ext
          for f in *.*.*; do
            if [ -f "$f" ]; then
              base=$(echo "$f" | sed -E 's/\.[a-z0-9]{10,}\.(wasm|js|dat)$/.\1/')
              if [ "$base" != "$f" ]; then
                cp "$f" "$base"
              fi
            fi
          done

      - name: Remove pre-compressed files from root
        run: rm -f release/wwwroot/*.br release/wwwroot/*.gz

      - name: copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Uploading files to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: release/wwwroot
